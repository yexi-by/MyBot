[app]
name = "MyBot"
environment = "production"

[server]
host = "0.0.0.0"
port = 6055
websocket_path_prefix = "/ws"
access_log = false
log_level = "info"

[napcat]
websocket_token = "CHANGE_ME_NAPCAT_TOKEN"
# 删除或留空即可关闭 WebSocket Token 校验。
send_max_attempts = 5
send_retry_delay_seconds = 0

[storage.images]
directory = "images"
download_concurrency = 16
download_timeout_seconds = 20
max_bytes = 52428800
retry_delays_seconds = [1, 5, 20]
lease_seconds = 45

[network]
proxy = ""
timeout_seconds = 15

[logging]
directory = "logs"
console_level = "INFO"
file_level = "DEBUG"
rotation = "50 MB"
retention = "30 days"
compression = "gz"

[llm.providers.deepseek]
api_key = "sk-CHANGE_ME"
# 无鉴权的 OpenAI 兼容服务可删除 api_key。
base_url = "https://api.deepseek.com"
max_attempts = 5
retry_delay_seconds = 0

[mcp]
enabled = false

[mcp.servers.node_stdio_example]
command = "npx"
args = ["-y", "your-node-mcp-server-package"]
env = { EXAMPLE_API_KEY = "CHANGE_ME" }
disabled = true

[database]
host = "localhost"
port = 5432
name = "mybot"
user = "mybot"
password = "CHANGE_ME_POSTGRES_PASSWORD"
# 无密码数据库可删除 password；Docker 使用 password_file，并删除 password。
# password_file = "/run/secrets/postgres_password"
pool_size = 20
max_overflow = 20
pool_timeout_seconds = 2
statement_timeout_seconds = 5

[plugins.ai_group_chat]
model = { provider = "deepseek", name = "deepseek-chat", supports_images = false }
max_tool_rounds = 16
token_safety_factor = 1.05
context_compression_notice = "上下文有点长，我先整理一下记忆，稍等我几秒喵~"
max_reply_chars = 1000
show_reasoning = false
retain_reasoning = false
debug_dump_messages = false
extra_requirements_file = "ai_group_chat/prompts/extra_requirements.md"
allow_mention_all = false
retain_tool_results = false

[plugins.ai_group_chat.vision]
model = { provider = "deepseek", name = "vision-model" }
system_prompt_file = "ai_group_chat/prompts/vision/system.md"
user_prompt_file = "ai_group_chat/prompts/vision/user.md"
max_attempts = 5
retry_delay_seconds = 0.25
retain_descriptions = true

[plugins.ai_group_chat.images]
max_per_turn = 20
fetch_concurrency = 16
download_timeout_seconds = 20
forward_tool_enabled = true
forward_max_per_call = 20
forward_max_per_turn = 50

[[plugins.ai_group_chat.groups]]
id = "123456789"
system_prompt_file = "ai_group_chat/prompts/roles/default.md"
knowledge_base_file = "ai_group_chat/knowledge/default.md"
max_context_tokens = 64000

[plugins.group_notice]
groups = ["123456789"]
send_avatar = true

[plugins.auto_unban]
protected_users = ["10000"]

[plugins.image_generate]
groups = ["123456789"]
model = { provider = "deepseek", name = "image-model" }
fetch_concurrency = 16
download_timeout_seconds = 20

[plugins.neavo_image_generate]
groups = ["123456789"]
base_url = "https://image-api.example.com"
api_token = "CHANGE_ME"
# Neavo 服务不要求鉴权时可删除 api_token。
poll_interval_seconds = 3
generation_timeout_seconds = 600
request_timeout_seconds = 30
max_image_bytes = 20971520

[plugins.recall_bot_image]
