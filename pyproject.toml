[project]
name = "qq-agent-harness"
version = "1.0.0"
description = "QQ 环境中的自主对话 Agent Harness"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.128.0", "httpx>=0.28.1", "pydantic>=2.12.5",
  "tomlkit>=0.15.1", "uvicorn[standard]>=0.40.0", "mcp>=1.27.0",
  "jsonschema>=4.25.0",
  "anyio>=4.12.0",
]
[project.scripts]
qq-agent-harness = "qq_agent_harness.main:main"
qq-harness-runner = "qq_agent_harness.sandbox.runner:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["qq_agent_harness"]
[dependency-groups]
dev = ["basedpyright>=1.38.4", "pytest>=9.0.3", "pytest-asyncio>=1.2.0", "ruff>=0.14.0", "types-jsonschema>=4.25.0"]
[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.14"
include = ["qq_agent_harness", "tests"]
exclude = [".venv", "tmp", "webui"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
[tool.ruff]
target-version = "py314"
line-length = 100
include = ["qq_agent_harness/**/*.py", "tests/**/*.py"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
