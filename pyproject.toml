[project]
name = "mybot-dev"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "dishka>=1.7.2",
    "fastapi>=0.128.0",
    "filetype>=1.2.0",
    "loguru>=0.7.3",
    "mcp>=1.27.0",
    "openai>=2.14.0",
    "pydantic>=2.12.5",
    "sqlalchemy[asyncio]>=2.0.52",
    "tenacity>=9.1.2",
    "tomlkit>=0.15.1",
    "uvicorn[standard]>=0.40.0",
    "watchfiles>=1.1.1",
    "websockets>=15.0.1",
]

[dependency-groups]
dev = [
    "basedpyright>=1.38.4",
    "pytest>=9.0.3",
]

[tool.basedpyright]
typeCheckingMode = "strict"
exclude = [
    "archived_plugins",
    ".venv",
    "data",
    "debug",
    "docs",
    "image",
    "logs",
    "tmp",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
