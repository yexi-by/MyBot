[app]
name = "MyBot"
environment = "production"

[server]
host = "0.0.0.0"
port = 6055
websocket_path_prefix = "/ws"
access_log = false
log_level = "info"

[napcat]
websocket_token = "CHANGE_ME_NAPCAT_TOKEN"
send_retry_count = 5
send_retry_delay = 0

[storage]
image_path = "images"
image_download_concurrency = 16
image_download_timeout_seconds = 20
image_max_bytes = 52428800
image_retry_delays_seconds = [1, 5, 20]
image_lease_seconds = 45

[network]
proxy = ""
timeout_seconds = 15

[logging]
directory = "logs"
console_level = "INFO"
file_level = "DEBUG"
rotation = "50 MB"
retention = "30 days"
compression = "gz"

[mcp]
enabled = false

[mcp.mcpServers.node_stdio_example]
command = "npx"
args = ["-y", "your-node-mcp-server-package"]
env = { EXAMPLE_API_KEY = "CHANGE_ME" }
disabled = true

[llm]

[[llm.providers]]
api_key = "sk-CHANGE_ME"
base_url = "https://api.deepseek.com"
model_vendors = "deepseek"
provider_type = "openai"
retry_count = 5
retry_delay = 0

[database]
host = "localhost"
port = 5432
name = "mybot"
user = "mybot"
password = "CHANGE_ME_POSTGRES_PASSWORD"
# Docker 使用 password_file，并删除 password。
# password_file = "/run/secrets/postgres_password"
pool_size = 20
max_overflow = 20
pool_timeout_seconds = 2
statement_timeout_seconds = 5
