# QQ Agent Harness；不要提交真实密钥。
persona_file = "persona.md"
knowledge_files = ["knowledge.md"]

[server]
host = "0.0.0.0"
port = 6055

[napcat]
token = ""
expected_bot_id = ""
action_timeout = 30.0
media_timeout = 30.0
media_max_bytes = 50000000
media_concurrency = 4
event_queue_size = 128

[runtime]
concurrent_conversations = 4
max_model_rounds = 20
history_count = 60
max_pending_conversations = 100
max_pending_messages = 20
activity_limit = 200
max_retained_sessions = 100
max_retained_bytes = 268435456
config_text_max_bytes = 2000000

# 服务商只负责连接；模型在各会话的 model 和 idle_compaction.model 中选择。
[providers.default]
protocol = "responses"
base_url = "https://api.openai.com/v1"
api_key = ""
timeout = 120.0
max_retries = 10
store_supported = true

[providers.default.headers]

[groups]

[private]
enabled = false
keywords = []

# 会话模型；未填写模型名称时该会话不回复。
[private.model]
provider = "default"
name = ""
# 思考等级未配置时不发送；按接口实际支持可选 none/minimal/low/medium/high/xhigh/max。
# reasoning_effort = "high"
# 上下文预算：达到 80% 时用会话模型把旧资料压缩到预算的 compaction_target_percent。
max_context_tokens = 128000
compaction_target_percent = 50
modalities = ["text", "image"]

# 闲时压缩：闲置 after_minutes 分钟且上下文不少于 min_tokens 时，
# 把人格和知识库以外的全部内容压缩成一份摘要，不保留原文。
[private.idle_compaction]
enabled = false
after_minutes = 10
min_tokens = 16000

# 压缩模型；provider 留空时使用会话模型。
[private.idle_compaction.model]
provider = ""
name = ""
max_context_tokens = 128000

[private.policy]
allow_at_all = false
cross_groups = []
cross_private = false
max_sends_per_turn = 5

[private.policy.categories]
"messages.read" = true
"messages.send" = true
"members.read" = true

[private.policy.tools]

[private.policy.parameters]

[mcp]

[sandbox]
enabled = false
runner_url = "http://127.0.0.1:6060"
runner_token = ""
quota_bytes = 50000000000
cpus = 2.0
memory_bytes = 4294967296
pids_limit = 256
command_timeout = 120.0
output_limit = 1048576
transfer_max_bytes = 50000000
max_pending_operations = 32
