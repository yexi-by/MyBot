name: qq-agent-harness
services:
  harness:
    container_name: mybot
    image: ${HARNESS_IMAGE:?use an explicit application image tag}
    command: ["qq-agent-harness", "--config", "/app/config/harness.toml"]
    network_mode: host
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./config:/app/config:rw
      - ${WORKSPACE_DIR:-./workspace}:/workspace:rw
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: "3"
